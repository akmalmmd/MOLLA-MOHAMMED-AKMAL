<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home | Haven Hotel</title><link rel="stylesheet" href="/style.css"></head>
<body><nav><a class="brand" href="/">Haven Hotel</a><div class="links" id="nav-links"></div></nav>

<section class="hero"><div class="hero-content"><div class="eyebrow">Welcome to Haven Hotel</div><h1>Stay somewhere<br>that feels special.</h1><p>Discover thoughtfully designed rooms, warm hospitality and an effortless booking experience.</p><a class="btn gold" href="/rooms.html">Explore rooms</a></div></section>
<main class="container"><form class="search-panel" id="room-search"><div class="search-grid">
<div class="field"><label>Check-in</label><input type="date" name="check_in" min="2026-11-06"></div>
<div class="field"><label>Check-out</label><input type="date" name="check_out" min="2026-11-07"></div>
<div class="field"><label>Room type</label><select name="room_type"><option value="">Any type</option><option>Single Room</option><option>Double Room</option><option>Deluxe Room</option><option>Suite Room</option><option>Family Room</option></select></div>
<div class="field"><label>Guests</label><input type="number" name="guests" min="1" placeholder="1"></div>
<button type="submit">Search rooms</button></div></form>
<div class="section-head"><div><div class="eyebrow">Your next stay</div><h2>Featured rooms</h2></div><a href="/rooms.html" class="btn light">View all rooms</a></div><div id="room-list" class="room-grid"></div></main>
<footer>© 2026 Haven Hotel · A comfortable stay, made simple.</footer><script src="/script.js"></script></body></html>
