<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Haven Hotel</title><link rel="stylesheet" href="/style.css"></head>
<body><nav><a class="brand" href="/">Haven Hotel</a><div class="links" id="nav-links"></div></nav>

<main class="container"><div class="section-head"><div><div class="eyebrow">Management portal</div><h1 class="page-title">Admin dashboard</h1><p class="muted">Manage rooms, reservations and hotel activity.</p></div></div><div id="admin-message" class="hidden"></div><div id="stats" class="stats"></div>
<div class="admin-grid"><section class="panel"><h2 id="room-form-title">Add a room</h2><form id="room-form"><input type="hidden" name="id"><div class="field"><label>Room number</label><input name="room_number" required></div><div class="field"><label>Room type</label><select name="room_type" required><option value="">Select type</option><option>Single Room</option><option>Double Room</option><option>Deluxe Room</option><option>Suite Room</option><option>Family Room</option></select></div><div class="field"><label>Description</label><textarea name="description" rows="3"></textarea></div><div class="form-grid"><div class="field"><label>Price per night (₹)</label><input type="number" name="price" min="1" step="0.01" required></div><div class="field"><label>Capacity</label><input type="number" name="capacity" min="1" required></div></div><div class="field"><label>Image URL</label><input type="url" name="image_url"></div><div class="field"><label>Status</label><select name="status"><option>Available</option><option>Maintenance</option></select></div><button type="submit">Save room</button> <button type="reset" class="btn light" onclick="document.getElementById('room-form-title').textContent='Add a room'">Clear</button></form></section>
<section><h2>Manage rooms</h2><div id="admin-rooms"></div></section></div>
<section style="margin-top:35px"><h2>All customer bookings</h2><div id="admin-bookings"></div></section></main>
<footer>© 2026 Haven Hotel · A comfortable stay, made simple.</footer><script src="/script.js"></script></body></html>
