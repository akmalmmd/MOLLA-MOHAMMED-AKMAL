<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | Haven Hotel</title><link rel="stylesheet" href="/style.css"></head>
<body><nav><a class="brand" href="/">Haven Hotel</a><div class="links" id="nav-links"></div></nav>

<main class="container"><form class="auth-wrap" id="register-form"><div class="eyebrow">Join Haven Hotel</div><h1>Create account</h1><div id="message" class="hidden"></div><div class="field"><label>Full name</label><input name="name" required minlength="2"></div><div class="field"><label>Email address</label><input type="email" name="email" required></div><div class="field"><label>Phone</label><input name="phone" maxlength="20"></div><div class="field"><label>Password (minimum 8 characters)</label><input type="password" name="password" required minlength="8"></div><div class="field"><label>Confirm password</label><input type="password" name="confirm_password" required minlength="8"></div><button type="submit" class="btn">Create account</button><p class="muted">Already registered? <a href="/login.html">Login</a>.</p></form></main>
<footer>© 2026 Haven Hotel · A comfortable stay, made simple.</footer><script src="/script.js"></script></body></html>
